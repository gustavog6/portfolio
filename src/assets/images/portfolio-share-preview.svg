<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c1f"/>
      <stop offset="1" stop-color="#101417"/>
    </linearGradient>
    <radialGradient id="avatar-glow">
      <stop offset="0" stop-color="#00e3d2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#00e3d2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#000" stroke-opacity=".16"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#00e3d2" stroke-opacity=".08"/>
    </pattern>
    <filter id="pixel-glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="574" rx="4" fill="#181c1f" stroke="#3b4249" stroke-width="2"/>
