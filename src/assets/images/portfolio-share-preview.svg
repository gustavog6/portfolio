  <ellipse cx="267" cy="390" rx="168" ry="130" fill="url(#avatar-glow)"/>
  <path d="M126 170H408M126 480H408" stroke="#37d9cb" stroke-opacity=".45"/>
  <g transform="translate(163 160) scale(4)" shape-rendering="crispEdges" filter="url(#pixel-glow)">
    <rect x="13" y="5" width="28" height="12" fill="#412b32"/>
    <rect x="9" y="10" width="28" height="12" fill="#412b32"/>
